name: CI
permissions:
  contents: read

on:
  push:
    branches: [ "master" ]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Run type check
      run: npm run typecheck
